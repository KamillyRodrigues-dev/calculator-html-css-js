<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/javascript.js" defer></script>
</head>
<body>  
    <main class ="calculator">
        <header class ="header-calculator">
            <div class="result-display-container">
                <div class="display-container">
                    <input type="text" disabled id="display">
                </div>
            </div>
        </header>
        <div class="box-buttons">
            <button>C</button>
            <button>DEL</button>
            <button>%</button>
            <button>/</button>
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button>*</button>
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button>-</button>
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button>+</button>
            <button>.</button>
            <button>0</button>
            <button class="equal">=</button>
        </div> <!--box-buttons-->
    </main>
</body>
</html>
